<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | PREMIUM EVIDENCE TECHNOLOGY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-auth-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: var(--dark-card);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 90%;
        }

        /* Mobile-First Dashboard Layout */
        .admin-dashboard-container {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 100vh;
            background: var(--dark-bg);
            color: white;
        }

        .admin-sidebar {
            background: #0b1120;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-sidebar h2 {
            font-size: 1.1rem;
            margin-bottom: 0;
            color: var(--accent);
        }

        .admin-sidebar ul {
            list-style: none;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
        }

        .admin-sidebar li {
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.03);
        }

        .admin-sidebar li:hover,
        .admin-sidebar li.active {
            background: var(--primary);
            color: white;
        }

        .admin-main {
            padding: 20px;
            overflow-y: auto;
        }

        .admin-card-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .admin-stat-card {
            background: var(--dark-card);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .admin-stat-card h3 {
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .admin-stat-card p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }

        .admin-table-wrap {
            background: var(--dark-card);
            border-radius: var(--radius);
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px;
        }

        .admin-table th,
        .admin-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .admin-table th {
            color: white;
            font-weight: 600;
        }

        /* Desktop Breakpoint (768px and above) */
        @media (min-width: 768px) {
            .admin-dashboard-container {
                grid-template-columns: 260px 1fr;
            }

            .admin-sidebar {
                flex-direction: column;
                justify-content: flex-start;
                align-items: stretch;
                border-bottom: none;
                border-right: 1px solid rgba(255, 255, 255, 0.05);
                padding: 30px 20px;
            }

            .admin-sidebar h2 {
                margin-bottom: 30px;
                font-size: 1.2rem;
            }

            .admin-sidebar ul {
                flex-direction: column;
                gap: 8px;
            }

            .admin-sidebar li {
                font-size: 0.9rem;
                padding: 12px 15px;
                background: transparent;
            }

            .admin-main {
                padding: 40px;
            }

            .admin-card-grid {
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 20px;
                margin-bottom: 40px;
            }

            .admin-stat-card {
                padding: 25px;
            }

            .admin-table-wrap {
                padding: 25px;
            }

            .admin-table th,
            .admin-table td {
                padding: 15px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>

    <!-- PIN View (Shown first to protect the login form) -->
    <div id="pin-view" class="admin-auth-container">
        <h2 style="margin-bottom: 20px; text-align: center;">Security Gateway</h2>
        <p style="text-align: center; color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 20px;">Enter
            access PIN to reveal the login form.</p>
        <div class="form-group">
            <input type="password" id="access-pin" placeholder="••••"
                style="width:100%; padding:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); color:white; text-align: center; letter-spacing: 5px; font-size: 1.2rem;">
        </div>
        <button id="verify-pin-btn" class="btn btn-primary"
            style="width:100%; margin-top:20px; justify-content:center;">Verify PIN</button>
        <p id="pin-error" style="color:#ef4444; margin-top:15px; text-align:center; font-size:0.9rem;"></p>
    </div>

    <!-- Login View (Hidden until PIN is correct) -->
    <div id="auth-view" class="admin-auth-container" style="display: none;">
        <h2 style="margin-bottom: 20px; text-align: center;">Admin Login</h2>
        <form id="admin-login-form">
            <div class="form-group">
                <label style="color:white; margin-bottom:5px; display:block;">Email Address</label>
                <!-- Email placeholder has been completely removed for security -->
                <input type="email" id="login-email" required
                    style="width:100%; padding:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); color:white;">
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label style="color:white; margin-bottom:5px; display:block;">Password</label>
                <input type="password" id="login-password" required placeholder="••••••••••••"
                    style="width:100%; padding:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); color:white;">
            </div>
            <button type="submit" class="btn btn-primary"
                style="width:100%; margin-top:20px; justify-content:center;">Login to Dashboard</button>
            <p id="login-error" style="color:#ef4444; margin-top:15px; text-align:center; font-size:0.9rem;"></p>
        </form>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="admin-dashboard-container" style="display: none;">
        <aside class="admin-sidebar">
            <h2>PREMIUM EVIDENCE</h2>
            <ul>
                <li class="active" onclick="switchTab('overview', event)"><i class="fas fa-chart-pie"></i> Overview</li>
                <li onclick="switchTab('messages', event)"><i class="fas fa-envelope"></i> Inquiries</li>
                <li onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</li>
            </ul>
        </aside>
        <main class="admin-main">
            <h1 id="welcome-title" style="margin-bottom: 25px; font-size: 1.5rem;">Dashboard Overview</h1>

            <!-- Overview Tab -->
            <div id="tab-overview" class="admin-tab-content">
                <div class="admin-card-grid">
                    <div class="admin-stat-card">
                        <h3 id="stat-messages">0</h3>
                        <p>Total Client Inquiries</p>
                    </div>
                </div>
            </div>

            <!-- Messages Tab -->
            <div id="tab-messages" class="admin-tab-content" style="display: none;">
                <div class="admin-table-wrap">
                    <h3 style="margin-bottom: 20px; font-size: 1.1rem;">Client Contact Messages</h3>
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Service</th>
                                <th>Budget</th>
                                <th>Message</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="messages-table-body">
                            <!-- Inquiries injected dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        // Define your secret UI PIN here (you can change "7788" to any sequence)
        const GATEWAY_PIN = "818809";

        // PIN Verification Logic
        document.getElementById('verify-pin-btn').addEventListener('click', () => {
            const enteredPin = document.getElementById('access-pin').value;
            if (enteredPin === GATEWAY_PIN) {
                document.getElementById('pin-view').style.display = 'none';
                document.getElementById('auth-view').style.display = 'block';
            } else {
                document.getElementById('pin-error').textContent = 'Access denied. Incorrect PIN.';
                document.getElementById('access-pin').value = '';
            }
        });

        // Allow pressing "Enter" on the PIN input
        document.getElementById('access-pin').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('verify-pin-btn').click();
            }
        });

        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');

            try {
                const res = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('adminToken', data.token);
                    loadDashboard();
                } else {
                    errorEl.textContent = data.error || 'Invalid credentials';
                }
            } catch (err) {
                errorEl.textContent = 'Server connection failed';
            }
        });

        function checkAuth() {
            const token = localStorage.getItem('adminToken');
            if (token) {
                document.getElementById('pin-view').style.display = 'none';
                document.getElementById('auth-view').style.display = 'none';
                loadDashboard();
            }
        }

        async function loadDashboard() {
            document.getElementById('auth-view').style.display = 'none';
            document.getElementById('pin-view').style.display = 'none';
            document.getElementById('dashboard-view').style.display = 'grid';

            const token = localStorage.getItem('adminToken');
            try {
                const res = await fetch(`${API_BASE}/messages`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('stat-messages').textContent = data.count;
                    const tbody = document.getElementById('messages-table-body');
                    tbody.innerHTML = data.data.map(m => `
                        <tr>
                            <td>${m.name}</td>
                            <td><a href="mailto:${m.email}" style="color:var(--accent);">${m.email}</a></td>
                            <td>${m.service}</td>
                            <td>${m.budget || 'N/A'}</td>
                            <td>${m.message}</td>
                            <td>${new Date(m.createdAt).toLocaleDateString()}</td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error('Failed to load dashboard data');
            }
        }

        function switchTab(tab, event) {
            document.querySelectorAll('.admin-sidebar li').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            document.getElementById('tab-overview').style.display = tab === 'overview' ? 'block' : 'none';
            document.getElementById('tab-messages').style.display = tab === 'messages' ? 'block' : 'none';
            document.getElementById('welcome-title').textContent = tab === 'overview' ? 'Dashboard Overview' : 'Client Inquiries';
        }

        function logout() {
            localStorage.removeItem('adminToken');
            location.reload();
        }

        checkAuth();
    </script>
</body>

</html>
